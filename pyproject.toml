[project]
name = "argus-contract-tooling"
version = "0.1.0"
description = "Generation and compatibility checks for Argus language-neutral contracts"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.72.1",
    "jsonschema[format]>=4.26,<5",
    "ruff>=0.16.4,<0.17",
    "ty>=0.0.1,<1",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["contracts/generated/python", "contracts/scripts", "contracts/tests"]

[tool.ty.terminal]
error-on-warning = true
