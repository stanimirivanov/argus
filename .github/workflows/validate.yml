name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep job names stable for the manual pre-merge check. Race and supply-chain
  # sensors run separately so their failures remain visible to reviewers.
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/quality/go.mod
            tools/quality/go.sum
            tools/actionlint/go.mod
            tools/actionlint/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install TypeScript dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir examples/functional-api/test-repository install --frozen-lockfile
          pnpm --dir examples/functional-api/billing-test-repository install --frozen-lockfile
          pnpm --dir examples/functional-api/repair-test-repository install --frozen-lockfile

      - name: Report toolchain
        run: make doctor

      - name: Run fast verification suite
        run: make verify

  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run race suite
        run: make race

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/quality/go.mod
            tools/quality/go.sum
            tools/actionlint/go.mod
            tools/actionlint/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run supply-chain suite
        run: make supply-chain

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      GOTOOLCHAIN: local
      ARGUS_TEST_POSTGRES_URL: postgres://postgres:argus_test@127.0.0.1:5432/postgres?sslmode=disable

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: argus_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run PostgreSQL integration suite
        run: make db-validate

      - name: Set up pnpm for the API reference campaign
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js for the API reference campaign
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install reference dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir examples/functional-api/test-repository install --frozen-lockfile
          pnpm --dir examples/functional-api/billing-test-repository install --frozen-lockfile
          pnpm --dir examples/functional-api/repair-test-repository install --frozen-lockfile

      - name: Run Playwright API reference campaign with durable evidence
        env:
          ARGUS_DATABASE_URL: ${{ env.ARGUS_TEST_POSTGRES_URL }}
        run: make api-validate

      - name: Install Chromium for browser execution campaign
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real browser execution campaign
        run: make ui-validate

      - name: Run browser plan and durable shadow campaign
        env:
          ARGUS_DATABASE_URL: ${{ env.ARGUS_TEST_POSTGRES_URL }}
          ARGUS_BROWSER_CAMPAIGN_DIR: .local/browser-shadow
        run: node examples/functional-ui/shadow-campaign.mjs

      - name: Retain browser attempts, report, and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-shadow-evidence
          path: .local/browser-shadow
          if-no-files-found: ignore

  dbos-webhook:
    name: DBOS webhook integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/quality/go.mod
            tools/quality/go.sum

      - name: Run self-provisioned DBOS webhook suite
        run: make dbos-evaluate

      - name: Retain DBOS compatibility and cost evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbos-evaluation-evidence
          path: .local/dbos-evaluation/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  ci-policy:
    name: CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Check CI workflow policy
        run: make ci-policy-check
