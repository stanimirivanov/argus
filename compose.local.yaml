# Disposable workstation database for explicit --local command mode only.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus_dev
      POSTGRES_PASSWORD: argus_dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_dev -d argus"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - argus-local-postgres:/var/lib/postgresql/data

volumes:
  argus-local-postgres:
